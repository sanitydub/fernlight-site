<!doctype html>
<!-- Source for the social share image. Rendered to PNG at 1200×630 (see README → "Regenerating images"). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fernlight share image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0A0C0A; color: #F2F4EF; font-family: 'Inter Tight', sans-serif; font-weight: 300; position: relative; }
  .ruler { position: absolute; left: 0; right: 0; height: 8px; background: repeating-linear-gradient(90deg, #4A524A 0 1px, transparent 1px 240px) top / 100% 8px no-repeat, repeating-linear-gradient(90deg, #2C322C 0 1px, transparent 1px 24px) top / 100% 4px no-repeat; }
  .top { top: 0; } .bottom { bottom: 0; transform: scaleY(-1); }
  .copy { position: absolute; left: 72px; top: 72px; bottom: 72px; width: 600px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 16px; font-size: 44px; font-weight: 400; letter-spacing: -0.02em; }
  .logo svg { width: 48px; height: 92px; }
  h1 { margin: 0; font-size: 84px; font-weight: 400; line-height: 0.98; letter-spacing: -0.045em; }
  .url { font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #8FD45E; letter-spacing: 0.02em; }
  .leaf { position: absolute; aspect-ratio: 4 / 5; }
  .pale { right: 300px; top: 104px; width: 256px; background: #CFE0CF; border-radius: 0 70% 0 70%; }
  .green { right: 72px; top: 72px; width: 320px; background: #8FD45E; border-radius: 70% 0 70% 0; overflow: hidden; }
  .glow { position: absolute; right: 4%; top: 2%; width: 48%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(255, 252, 220, .8), rgba(255, 252, 220, 0) 70%); }
  .fern { position: absolute; left: 8%; bottom: -4%; width: 84%; height: 92%; }
  .serif { font-family: 'Instrument Serif', serif; font-style: italic; }
</style>
</head>
<body>
  <div class="ruler top"></div>
  <div class="copy">
    <div class="logo">
      <svg viewBox="-80 -300 160 310" aria-hidden="true">
        <g fill="#F2F4EF" stroke="#F2F4EF" transform="rotate(10)">
          <path d="M0 10 L0 -280" stroke-width="10" stroke-linecap="round"/>
          <g stroke="none">
            <ellipse cx="34" cy="0" rx="34" ry="12" transform="translate(0 -30) rotate(-30)"/><ellipse cx="34" cy="0" rx="34" ry="12" transform="translate(0 -30) rotate(-150)"/>
            <ellipse cx="29" cy="0" rx="29" ry="11" transform="translate(0 -80) rotate(-30)"/><ellipse cx="29" cy="0" rx="29" ry="11" transform="translate(0 -80) rotate(-150)"/>
            <ellipse cx="23" cy="0" rx="23" ry="9" transform="translate(0 -130) rotate(-30)"/><ellipse cx="23" cy="0" rx="23" ry="9" transform="translate(0 -130) rotate(-150)"/>
            <ellipse cx="16" cy="0" rx="16" ry="7" transform="translate(0 -180) rotate(-30)"/><ellipse cx="16" cy="0" rx="16" ry="7" transform="translate(0 -180) rotate(-150)"/>
          </g>
        </g>
        <circle cx="48" cy="-270" r="22" fill="#8FD45E"/>
      </svg>
      Fernlight
    </div>
    <h1>Rooted in craft.<br>Grown with <span class="serif">AI.</span></h1>
    <div class="url">fernlightapps.com</div>
  </div>
  <div class="leaf pale"></div>
  <div class="leaf green">
    <div class="glow"></div>
    <svg class="fern" viewBox="-90 -300 180 310" aria-hidden="true">
      <g fill="#0A0C0A" transform="rotate(14) translate(-6 0)">
        <path d="M0 14 L0 -290" stroke="#0A0C0A" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="35" cy="0" rx="35" ry="9" transform="translate(0 -20) rotate(-30)"/><ellipse cx="35" cy="0" rx="35" ry="9" transform="translate(0 -20) rotate(-150)"/>
        <ellipse cx="34" cy="0" rx="34" ry="9" transform="translate(0 -44) rotate(-30)"/><ellipse cx="34" cy="0" rx="34" ry="9" transform="translate(0 -44) rotate(-150)"/>
        <ellipse cx="32" cy="0" rx="32" ry="8.5" transform="translate(0 -68) rotate(-30)"/><ellipse cx="32" cy="0" rx="32" ry="8.5" transform="translate(0 -68) rotate(-150)"/>
        <ellipse cx="30" cy="0" rx="30" ry="8" transform="translate(0 -92) rotate(-30)"/><ellipse cx="30" cy="0" rx="30" ry="8" transform="translate(0 -92) rotate(-150)"/>
        <ellipse cx="27.5" cy="0" rx="27.5" ry="7.5" transform="translate(0 -116) rotate(-30)"/><ellipse cx="27.5" cy="0" rx="27.5" ry="7.5" transform="translate(0 -116) rotate(-150)"/>
        <ellipse cx="25" cy="0" rx="25" ry="7" transform="translate(0 -140) rotate(-30)"/><ellipse cx="25" cy="0" rx="25" ry="7" transform="translate(0 -140) rotate(-150)"/>
        <ellipse cx="22" cy="0" rx="22" ry="6" transform="translate(0 -164) rotate(-30)"/><ellipse cx="22" cy="0" rx="22" ry="6" transform="translate(0 -164) rotate(-150)"/>
        <ellipse cx="19" cy="0" rx="19" ry="5.5" transform="translate(0 -188) rotate(-30)"/><ellipse cx="19" cy="0" rx="19" ry="5.5" transform="translate(0 -188) rotate(-150)"/>
        <ellipse cx="16" cy="0" rx="16" ry="4.5" transform="translate(0 -212) rotate(-30)"/><ellipse cx="16" cy="0" rx="16" ry="4.5" transform="translate(0 -212) rotate(-150)"/>
        <ellipse cx="12.5" cy="0" rx="12.5" ry="4" transform="translate(0 -236) rotate(-30)"/><ellipse cx="12.5" cy="0" rx="12.5" ry="4" transform="translate(0 -236) rotate(-150)"/>
        <ellipse cx="9" cy="0" rx="9" ry="3" transform="translate(0 -258) rotate(-30)"/><ellipse cx="9" cy="0" rx="9" ry="3" transform="translate(0 -258) rotate(-150)"/>
        <ellipse cx="6" cy="0" rx="6" ry="2.5" transform="translate(0 -278) rotate(-30)"/><ellipse cx="6" cy="0" rx="6" ry="2.5" transform="translate(0 -278) rotate(-150)"/>
      </g>
    </svg>
  </div>
  <div class="ruler bottom"></div>
</body>
</html>
