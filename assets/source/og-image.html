<!doctype html>
<!-- Source for the social share image. Rendered to PNG at 1200×630 (see README → "Regenerating images"). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fernlight share image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #F6F6F7; color: #18181B; font-family: 'Geist', sans-serif; position: relative; }
  .copy { position: absolute; left: 80px; top: 72px; bottom: 72px; width: 640px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 40px; letter-spacing: -0.03em; }
  .brand svg { width: 48px; height: 48px; }
  .brand rect { stroke: #F6F6F7; stroke-width: 7; }
  h1 { margin: 0; font-family: 'Geist', sans-serif; font-weight: 600; font-size: 80px; line-height: 0.98; letter-spacing: -0.045em; }
  .url { font-size: 24px; color: #52525B; }
  .tile { position: absolute; right: 80px; top: 115px; width: 400px; height: 400px; border-radius: 96px; background: #18181B; display: grid; place-items: center; }
  .tile svg { width: 230px; height: 230px; }
  .tile rect { stroke: #18181B; stroke-width: 7; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="32" y="6" width="62" height="50" rx="14" fill="#D4D4D8"/><rect x="19" y="25" width="62" height="50" rx="14" fill="#71717A"/><rect x="6" y="44" width="62" height="50" rx="14" fill="#18181B"/></svg>
      Fernlight
    </div>
    <h1>Everyday apps, made beautifully.</h1>
    <div class="url">fernlightapps.com</div>
  </div>
  <div class="tile">
    <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="32" y="6" width="62" height="50" rx="14" fill="#52525B"/><rect x="19" y="25" width="62" height="50" rx="14" fill="#A1A1AA"/><rect x="6" y="44" width="62" height="50" rx="14" fill="#FFFFFF"/></svg>
  </div>
</body>
</html>
